services:
  - type: web
    name: mileledger-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mileledger-db
          property: connectionString
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: mileledger-db
    plan: free
